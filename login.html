<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | DreamHomes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
      color: #e8ecff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(78,141,255,0.2), transparent);
      border-radius: 50%;
      top: -250px;
      right: -250px;
      pointer-events: none;
      animation: float 20s infinite ease-in-out;
    }

    body::after {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(138,91,255,0.15), transparent);
      border-radius: 50%;
      bottom: -200px;
      left: -200px;
      pointer-events: none;
      animation: float 15s infinite ease-in-out reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(30px, 30px) scale(1.1); }
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(19,26,45,0.85);
      backdrop-filter: blur(20px);
      padding: 18px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      border-bottom: 1px solid rgba(78,141,255,0.2);
      z-index: 100;
    }

    .logo {
      background: linear-gradient(135deg, #4e8dff, #8a5bff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 0.95rem;
      color: #c8d2ff;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 500;
    }

    nav a:hover {
      background: rgba(78,141,255,0.15);
      color: white;
      transform: translateY(-2px);
    }

    nav a.active {
      background: linear-gradient(135deg, #4e8dff, #8a5bff);
      color: white;
      box-shadow: 0 4px 20px rgba(78,141,255,0.5);
    }

    .login-section {
      max-width: 440px;
      margin: auto;
      padding: 50px 40px;
      background: rgba(21,29,49,0.6);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      box-shadow: 
        0 30px 60px rgba(0,0,0,0.5),
        0 0 1px rgba(255,255,255,0.1) inset,
        0 0 60px rgba(78,141,255,0.15);
      border: 1px solid rgba(78,141,255,0.2);
      text-align: center;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.8s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-section h2 {
      margin-bottom: 10px;
      font-size: 2rem;
      background: linear-gradient(135deg, #fff, #b8c9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .login-section p {
      color: #9fb1ff;
      font-size: 0.95rem;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .login-section form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 25px;
    }

    .input-group {
      position: relative;
    }

    .login-section input {
      width: 100%;
      padding: 16px 20px;
      border-radius: 16px;
      border: 1px solid rgba(78,141,255,0.25);
      background: rgba(26,34,54,0.6);
      backdrop-filter: blur(10px);
      color: white;
      font-size: 1rem;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .login-section input::placeholder {
      color: rgba(200,210,255,0.5);
    }

    .login-section input:focus {
      outline: none;
      border-color: #4e8dff;
      box-shadow: 0 0 20px rgba(78,141,255,0.5), 0 8px 25px rgba(0,0,0,0.3);
      background: rgba(26,34,54,0.8);
      transform: translateY(-2px);
    }

    .btn {
      margin-top: 10px;
      padding: 16px 20px;
      border: none;
      border-radius: 35px;
      background: linear-gradient(135deg, #4e8dff, #8a5bff);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        0 0 30px rgba(78,141,255,0.6),
        0 20px 40px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 
        0 0 40px rgba(78,141,255,0.8),
        0 25px 50px rgba(0,0,0,0.5);
    }

    .btn:active {
      transform: translateY(-2px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 25px 0;
      color: #8ea2ff;
      font-size: 0.9rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(78,141,255,0.3), transparent);
    }

    .social-login {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid rgba(78,141,255,0.25);
      background: rgba(26,34,54,0.6);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      color: #c8d2ff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
    }

    .social-btn:hover {
      background: rgba(78,141,255,0.15);
      border-color: #4e8dff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(78,141,255,0.3);
    }

    .forgot-password {
      margin-top: 15px;
      font-size: 0.9rem;
    }

    .forgot-password a {
      color: #76a3ff;
      text-decoration: none;
      transition: all 0.3s;
    }

    .forgot-password a:hover {
      color: #4e8dff;
      text-decoration: underline;
    }

    .signup-link {
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid rgba(78,141,255,0.15);
      color: #9fb1ff;
      font-size: 0.95rem;
    }

    .signup-link a {
      color: #4e8dff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }

    .signup-link a:hover {
      color: #76a3ff;
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 40px 0;
      color: #8ea2ff;
      font-size: 0.95rem;
      position: relative;
      z-index: 1;
      margin-top: auto;
    }

    @media (max-width: 600px) {
      header {
        padding: 16px 25px;
      }

      .logo {
        font-size: 1.5rem;
      }

      nav ul {
        flex-wrap: wrap;
        gap: 5px;
      }

      nav a {
        font-size: 0.85rem;
        padding: 8px 14px;
      }

      .login-section {
        margin: 40px 20px;
        padding: 40px 30px;
      }

      .login-section h2 {
        font-size: 1.6rem;
      }

      .social-login {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1 class="logo">DreamHomes</h1> 
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="properties.html">Properties</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html" class="active">Login</a></li>
      </ul>
    </nav>
  </header>

  <section class="login-section">
    <h2>Welcome Back</h2>
    <p>Login to access your dream home</p>
    
    <form>
      <div class="input-group">
        <input type="email" placeholder="Email Address" required>
      </div>
      <div class="input-group">
        <input type="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>

    <div class="forgot-password">
      <a href="#">Forgot your password?</a>
    </div>

    <div class="divider">or continue with</div>

    <div class="social-login">
      <button class="social-btn">Google</button>
      <button class="social-btn">Facebook</button>
    </div>

    <div class="signup-link">
      Don't have an account? <a href="#">Sign up</a>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 DreamHomes. All rights reserved.</p>
  </footer>
</body>
</html>
