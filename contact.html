<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | DreamHomes</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Segoe UI", Tahoma, sans-serif;
    }

    body{
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
      color:#e8ecff;
      min-height:100vh;
      position:relative;
      overflow-x:hidden;
    }

    body::before{
      content:'';
      position:fixed;
      width:500px;
      height:500px;
      background:radial-gradient(circle, rgba(78,141,255,0.15), transparent);
      border-radius:50%;
      top:-200px;
      right:-200px;
      pointer-events:none;
      animation:float 20s infinite ease-in-out;
    }

    body::after{
      content:'';
      position:fixed;
      width:400px;
      height:400px;
      background:radial-gradient(circle, rgba(138,91,255,0.12), transparent);
      border-radius:50%;
      bottom:-150px;
      left:-150px;
      pointer-events:none;
      animation:float 15s infinite ease-in-out reverse;
    }

    @keyframes float{
      0%, 100%{ transform:translate(0,0) scale(1); }
      50%{ transform:translate(30px, 30px) scale(1.1); }
    }

    header{
      position:sticky;
      top:0;
      background:rgba(19,26,45,0.85);
      backdrop-filter:blur(20px);
      padding:18px 50px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 8px 32px rgba(0,0,0,0.4);
      border-bottom:1px solid rgba(78,141,255,0.2);
      z-index:100;
    }

    header h1{
      background:linear-gradient(135deg, #4e8dff, #8a5bff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      font-size:2rem;
      font-weight:800;
      letter-spacing:-0.5px;
    }

    nav{
      display:flex;
      gap:8px;
      align-items:center;
    }

    nav a{
      padding:10px 20px;
      border-radius:25px;
      font-size:0.95rem;
      color:#c8d2ff;
      text-decoration:none;
      transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position:relative;
      font-weight:500;
    }

    nav a:hover{
      background:rgba(78,141,255,0.15);
      color:white;
      transform:translateY(-2px);
    }

    nav a.active{
      background:linear-gradient(135deg, #4e8dff, #6a9fff);
      color:white;
      box-shadow:0 4px 20px rgba(78,141,255,0.5);
    }

    nav .login-btn{
      background:linear-gradient(135deg, #4e8dff, #8a5bff);
      color:white;
      font-weight:600;
      box-shadow:0 4px 20px rgba(78,141,255,0.4);
      margin-left:8px;
    }

    nav .login-btn:hover{
      box-shadow:0 6px 30px rgba(78,141,255,0.6);
      transform:translateY(-3px);
    }

    main{
      max-width:1200px;
      margin:80px auto;
      padding:0 30px;
      position:relative;
      z-index:1;
    }

    .card{
      background:rgba(21,29,49,0.6);
      backdrop-filter:blur(20px);
      border-radius:32px;
      padding:60px;
      box-shadow:
        0 30px 60px rgba(0,0,0,0.5),
        0 0 1px rgba(255,255,255,0.1) inset,
        0 0 60px rgba(78,141,255,0.15);
      border:1px solid rgba(78,141,255,0.2);
      animation:fadeInUp 0.8s ease;
    }

    @keyframes fadeInUp{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .title{
      font-size:2.5rem;
      font-weight:800;
      margin-bottom:8px;
      background:linear-gradient(135deg, #fff, #b8c9ff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      letter-spacing:-1px;
    }

    .subtitle{
      color:#9fb1ff;
      font-size:1.05rem;
      margin-bottom:40px;
      opacity:0.9;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1.2fr;
      gap:50px;
      align-items:start;
    }

    .leftbox{
      background:linear-gradient(145deg, rgba(27,35,56,0.8), rgba(17,24,41,0.9));
      backdrop-filter:blur(10px);
      padding:35px;
      border-radius:24px;
      box-shadow:
        0 20px 40px rgba(0,0,0,0.4),
        0 0 1px rgba(255,255,255,0.1) inset;
      border:1px solid rgba(78,141,255,0.2);
      position:sticky;
      top:120px;
    }

    .tags{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:28px;
    }

    .tag{
      padding:8px 16px;
      background:rgba(78,141,255,0.15);
      color:#73a2ff;
      border-radius:25px;
      font-size:0.85rem;
      font-weight:600;
      border:1px solid rgba(78,141,255,0.4);
      box-shadow:0 0 15px rgba(78,141,255,0.3);
      transition:all 0.3s;
    }

    .tag:hover{
      background:rgba(78,141,255,0.25);
      transform:translateY(-2px);
      box-shadow:0 4px 20px rgba(78,141,255,0.4);
    }

    .info{
      margin-bottom:25px;
    }

    .info p{
      margin-bottom:14px;
      font-size:1rem;
      color:#d5dbff;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .info p::before{
      content:'';
      width:6px;
      height:6px;
      background:linear-gradient(135deg, #4e8dff, #8a5bff);
      border-radius:50%;
      box-shadow:0 0 10px rgba(78,141,255,0.6);
    }

    .info b{
      color:#7aa2ff;
      font-weight:600;
      min-width:70px;
    }

    .back{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-top:20px;
      font-size:0.95rem;
      color:#76a3ff;
      text-decoration:none;
      transition:all 0.3s;
      font-weight:500;
    }

    .back:hover{
      color:#4e8dff;
      transform:translateX(-5px);
    }

    form{
      display:flex;
      flex-direction:column;
      gap:22px;
    }

    form input,
    form select,
    form textarea{
      width:100%;
      padding:16px 20px;
      border-radius:16px;
      border:1px solid rgba(78,141,255,0.25);
      background:rgba(26,34,54,0.6);
      backdrop-filter:blur(10px);
      color:white;
      font-size:1rem;
      transition:all 0.3s;
      box-shadow:0 4px 15px rgba(0,0,0,0.2);
    }

    form input::placeholder,
    form textarea::placeholder{
      color:rgba(200,210,255,0.5);
    }

    form input:focus,
    form select:focus,
    form textarea:focus{
      border-color:#4e8dff;
      box-shadow:0 0 20px rgba(78,141,255,0.5), 0 8px 25px rgba(0,0,0,0.3);
      outline:none;
      background:rgba(26,34,54,0.8);
      transform:translateY(-2px);
    }

    textarea{
      resize:vertical;
      min-height:150px;
      font-family:inherit;
    }

    button{
      width:max-content;
      padding:16px 48px;
      border:none;
      background:linear-gradient(135deg,#4e8dff,#8a5bff);
      color:white;
      font-weight:700;
      border-radius:35px;
      font-size:1.1rem;
      cursor:pointer;
      margin-top:15px;
      align-self:center;
      box-shadow:
        0 0 30px rgba(78,141,255,0.6),
        0 20px 40px rgba(0,0,0,0.4);
      transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position:relative;
      overflow:hidden;
    }

    button::before{
      content:'';
      position:absolute;
      top:50%;
      left:50%;
      width:0;
      height:0;
      border-radius:50%;
      background:rgba(255,255,255,0.2);
      transform:translate(-50%, -50%);
      transition:width 0.6s, height 0.6s;
    }

    button:hover::before{
      width:300px;
      height:300px;
    }

    button:hover{
      transform:translateY(-4px);
      box-shadow:
        0 0 40px rgba(78,141,255,0.8),
        0 25px 50px rgba(0,0,0,0.5);
    }

    button:active{
      transform:translateY(-2px);
    }

    footer{
      text-align:center;
      padding:40px 0;
      color:#8ea2ff;
      font-size:0.95rem;
      position:relative;
      z-index:1;
    }

    @media(max-width:900px){
      .grid{
        grid-template-columns:1fr;
        gap:40px;
      }
      .leftbox{
        position:static;
      }
      header{
        padding:16px 25px;
      }
      nav{
        flex-wrap:wrap;
      }
      .card{
        padding:40px 30px;
      }
    }

    @media(max-width:600px){
      header h1{
        font-size:1.5rem;
      }
      .title{
        font-size:2rem;
      }
      nav a{
        font-size:0.85rem;
        padding:8px 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>DreamHomes</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#listings">Listings</a>
    <a href="index.html#about">About</a>
    <a href="contact.html" class="active">Contact</a>
    <a href="login.html" class="login-btn">Login</a>
  </nav>
</header>

<main>
  <div class="card">

    <div class="title">Contact Us</div>
    <div class="subtitle">We reply within 24 hours. Tell us how we can help you!</div>

    <div class="grid">

      <div class="leftbox">

        <div class="tags">
          <div class="tag">No Broker Fees</div>
          <div class="tag">Verified Listings</div>
          <div class="tag">24×7 Support</div>
        </div>

        <div class="info">
          <p><b>Email:</b> support@dreamhomes.com</p>
          <p><b>Phone:</b> +91-98765-43210</p>
          <p><b>Office:</b> DreamHomes HQ, Mumbai</p>
        </div>

        <a href="index.html" class="back">← Back to Home</a>
      </div>

      <form>
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email Address" required>
        <input type="text" placeholder="Preferred City (e.g., Mumbai, Pune)">
        
        <select required>
          <option value="">Select Service Type</option>
          <option>Buy</option>
          <option>Rent</option>
          <option>Sell</option>
        </select>

        <textarea placeholder="Tell us your budget and requirements..." required></textarea>

        <button type="submit">Send Message</button>
      </form>

    </div>

  </div>
</main>

<footer>
  © 2025 DreamHomes. All rights reserved.
</footer>

</body>
</html>
